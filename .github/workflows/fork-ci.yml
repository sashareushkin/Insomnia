name: Fork CI
on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Upstream PR number (empty tests custom)'
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: fork-ci-${{ github.event_name }}-${{ inputs.pr || github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      head: ${{ steps.target.outputs.head }}
      base: ${{ steps.target.outputs.base }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          if [ -z "$PR" ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            [[ "$PR" =~ ^[0-9]+$ ]]
            gh api "repos/$GH_REPO/pulls/$PR" > pr.json
            jq -e --arg repo "$GH_REPO" '.state == "open" and .base.ref == "custom" and .head.ref == "main" and .head.repo.full_name == $repo' pr.json
            echo "ref=refs/pull/$PR/merge" >> "$GITHUB_OUTPUT"
            echo "head=$(jq -r .head.sha pr.json)" >> "$GITHUB_OUTPUT"
            echo "base=$(jq -r .base.sha pr.json)" >> "$GITHUB_OUTPUT"
          fi
  swift:
    name: Swift build and test
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - name: Verify dispatched merge parents
        if: inputs.pr != ''
        env:
          EXPECTED_HEAD: ${{ needs.resolve.outputs.head }}
          EXPECTED_BASE: ${{ needs.resolve.outputs.base }}
        run: |
          # Read raw commit headers: git show %P omits parents at a shallow boundary.
          parents=$(git cat-file -p HEAD | sed -n 's/^parent //p' | paste -sd ' ' -)
          if [ "$parents" != "$EXPECTED_BASE $EXPECTED_HEAD" ]; then
            echo '::error::PR merge ref is stale; rerun after GitHub refreshes it'
            exit 1
          fi
      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test upstream sync without GitHub writes
        run: python3 -m unittest discover -s .github/scripts -p 'test_upstream_sync.py' -v
      - name: Build
        run: swift build
      - name: Test (isolated fixtures; no app installation)
        env:
          NSUnbufferedIO: 'YES'
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/fork-tests.log"
      - name: Test summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Swift build/test: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/fork-tests.log" ]; then
            tail -n 25 "$RUNNER_TEMP/fork-tests.log" >> "$GITHUB_STEP_SUMMARY"
          fi
  upstream-status:
    # Dispatch runs attach checks to custom. Publish the result on the upstream
    # PR head too, from a separate job that never executes PR code.
    if: always() && inputs.pr != '' && needs.resolve.result == 'success'
    needs: [resolve, swift]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ needs.resolve.outputs.head }}
          BASE: ${{ needs.resolve.outputs.base }}
          RESULT: ${{ needs.swift.result }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR" > pr.json
          jq -e --arg head "$HEAD" --arg base "$BASE" '.head.sha == $head and .base.sha == $base' pr.json
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api -X POST "repos/$GH_REPO/statuses/$HEAD" \
            -f state="$state" -f context='Swift build and test' \
            -f description="Upstream merge tested against $BASE" \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
